services:
  db:
    image: postgres:17-alpine
    container_name: review-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    ports:
      - "5433:5432"
    volumes:
      - review-db-data:/var/lib/postgresql/data

volumes:
  review-db-data:
